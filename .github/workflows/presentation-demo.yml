name: Publish presentation demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Get the project files
        uses: actions/checkout@v4
      - name: Prepare the presentation demo
        run: touch apps/web/.nojekyll
      - name: Upload the demo
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
