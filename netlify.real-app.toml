# Activate this only after DATABASE_URL and all R2 variables are saved in
# Netlify's environment settings. Rename it to netlify.toml for the real app.
[build]
  command = ""
  publish = "apps/web"
  functions = "netlify/functions"

[[redirects]]
  from = "/v1/*"
  to = "/.netlify/functions/api/v1/:splat"
  status = 200

[[redirects]]
  from = "/uploads/evidence/*"
  to = "/.netlify/functions/api/uploads/evidence/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
